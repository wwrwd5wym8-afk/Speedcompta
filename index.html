<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpeedCompta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-title" content="SpeedCompta">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0F3D3E">
<meta property="og:site_name" content="SpeedCompta">
<meta property="og:title" content="SpeedCompta · Espace client">
<meta property="og:description" content="Logiciel de comptabilité en ligne">
<meta property="og:image" content="icon-512.png">
<style>
  :root{--teal:#0F3D3E;--gold:#F5B700;--cream:#FBF8F2}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#0F1B33;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
  .c{text-align:center;max-width:420px}
  img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(15,61,62,.25)}
  h1{margin:18px 0 6px;font-size:28px;letter-spacing:-.02em}
  h1 span{color:var(--teal)}
  p{margin:0 0 18px;color:#4E6362}
  a.go{display:inline-block;padding:13px 24px;border-radius:12px;background:var(--teal);color:#fff;font-weight:700;text-decoration:none}
  .tip{margin-top:22px;font-size:13px;color:#5F7473;line-height:1.55;background:#F7FAF9;border:1px solid #E3EBEA;border-radius:12px;padding:12px 14px;text-align:left}
  .tip b{color:var(--teal)}
</style>
</head>
<body>
<div class="c">
  <img src="icon-512.png" alt="SpeedCompta">
  <h1>Speed<span>Compta</span></h1>
  <p>Simple · Rapide · Efficace</p>
  <a class="go" id="go" href="https://claude.ai/artifact/ANKbBV6iJDKWa4GXA8EqMb">Ouvrir SpeedCompta</a>
  <div class="tip"><b>Mettre l'application sur votre écran :</b><br>
    iPhone : bouton Partager ⬆︎ puis « Sur l'écran d'accueil ».<br>
    Android : menu ⋮ puis « Ajouter à l'écran d'accueil ».</div>
</div>
<script>
  /* ouvre directement SpeedCompta (avec un éventuel lien d'accès client #acces=…) */
  var go = document.getElementById("go"); go.href += location.hash || "";
  setTimeout(function () { location.replace(go.href); }, 1200);
</script>
</body>
</html>
